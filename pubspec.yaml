name: RUSH
description: "RUSH — UniKL RCMP User Helpdesk"
publish_to: 'UNIKL RCMP'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.2
  file_picker: ^8.0.0
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.2.2
  aad_oauth: ^1.0.0
  url_launcher: ^6.3.0
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/unikl_logo.png
    - lib/assets/images/bg.jpg
    - lib/assets/images/rush-mobile.png
    - lib/assets/images/rush-logo.png
  # Uncomment once you add a real campus photo, used by UserLoginScreen
  # as the full-bleed background (falls back to a gradient if missing).
  # assets:
  #   - assets/images/campus_background.jpg

flutter_launcher_icons:
  android: true
  image_path: "lib/assets/images/rush-mobile.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/assets/images/rush-mobile.png"